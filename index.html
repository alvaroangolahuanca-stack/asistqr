<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AsistQR 10 F</title>
<meta name="description" content="Control de asistencia escolar con QR, carnets y avisos por WhatsApp.">
<meta name="theme-color" content="#C8102E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AsistQR">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: una sola columna tipo app móvil (máx. 560px), cabecera roja institucional y barra de navegación inferior */
:root{
  --red:#C8102E; --red-dk:#8E0B21; --red-soft:#FBE9EC;
  --ink:#231719; --muted:#6E5F62; --line:#EADFE1; --paper:#FFFFFF; --mist:#F7F2F3;
  --ok:#1E7F4A; --ok-bg:#E3F4EA; --late:#B86A00; --late-bg:#FDF0DA;
  --abs:#7A1020; --abs-bg:#F6DADF; --lic:#2459A0; --lic-bg:#E2ECF8; --wa:#1DA851;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--mist);color:var(--ink);font:16px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
[hidden]{display:none!important}
.app{max-width:560px;margin:0 auto;min-height:100%;background:var(--paper);display:flex;flex-direction:column;position:relative}
/* Cabecera */
.top{background:var(--red);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.top .logo{width:44px;height:44px;border-radius:50%;background:#fff;flex:none;display:grid;place-items:center;overflow:hidden}
.top .logo img{width:40px;height:40px;object-fit:contain}
.top .t1{font:700 20px/1.05 var(--display);letter-spacing:.2px;text-transform:uppercase}
.top .t2{font-size:13px;opacity:.9}
.top .grow{flex:1;min-width:0}
.top .grow div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbadge{width:40px;height:40px;border-radius:10px;background:#fff;flex:none;overflow:hidden;display:grid;place-items:center}
.gbadge img{width:38px;height:38px;object-fit:contain}
main{flex:1;padding:16px max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
/* Navegación */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs button{border:0;background:none;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:10px;cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--red)}
nav.tabs button.scan{color:#fff}
nav.tabs button.scan .ic{background:var(--red);border-radius:16px;width:52px;height:40px;display:grid;place-items:center;margin-top:-4px;box-shadow:0 4px 12px rgba(200,16,46,.35)}
nav.tabs button.scan span{color:var(--red)}
/* Tipografía y piezas */
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
h2{font-size:26px;font-weight:800;text-transform:uppercase;letter-spacing:.3px}
h3{font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--red-dk)}
.sub{color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;text-decoration:none;color:var(--ink)}
.btn:focus-visible,nav.tabs button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(200,16,46,.35);outline-offset:2px}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.ghost{border-color:transparent;background:var(--mist)}
.btn.sm{min-height:36px;padding:6px 11px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn svg{width:20px;height:20px;flex:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.big{min-height:64px;font:800 22px var(--display);text-transform:uppercase;letter-spacing:.6px;border-radius:16px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--paper)}
.card.soft{background:var(--mist);border-color:transparent}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.field input,.field select,.field textarea{border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;min-height:46px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
.hint{font-size:13px;color:var(--muted)}
/* Estados */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.P{background:var(--ok-bg);color:var(--ok)}
.pill.T{background:var(--late-bg);color:var(--late)}
.pill.F{background:var(--abs-bg);color:var(--abs)}
.pill.L{background:var(--lic-bg);color:var(--lic)}
.pill.N{background:var(--mist);color:var(--muted)}
/* Resumen del día */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{border-radius:12px;padding:10px 8px;text-align:center;cursor:pointer;border:2px solid transparent}
.stat b{display:block;font:800 28px/1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.stat.P{background:var(--ok-bg);color:var(--ok)} .stat.T{background:var(--late-bg);color:var(--late)}
.stat.F{background:var(--abs-bg);color:var(--abs)} .stat.N{background:var(--mist);color:var(--muted)}
.stat.sel{border-color:currentColor}
.datebar{display:flex;align-items:center;gap:8px}
.datebar .d{flex:1;text-align:center}
.datebar .d b{display:block;font:700 20px var(--display);text-transform:uppercase}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
/* Listas */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);background:#fff;cursor:pointer;min-height:62px}
.item:last-child{border-bottom:0}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-weight:600;font-size:15px;line-height:1.2}
.item .nm small{color:var(--muted);font-size:13px}
.av{width:42px;height:42px;border-radius:50%;background:var(--red-soft);color:var(--red-dk);display:grid;place-items:center;font:700 16px var(--display);flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.wab{width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;flex:none;background:var(--wa);color:#fff}
.wab.done{background:var(--mist);color:var(--ok)}
.wab.nonum{background:#fff;color:var(--wa);border:2px dashed var(--wa)}
.wab svg{width:20px;height:20px}
.num{font-variant-numeric:tabular-nums}
.search{position:relative}
.search input{padding-left:40px}
.search svg{position:absolute;left:12px;top:13px;width:20px;height:20px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:700 20px var(--display);text-transform:uppercase;margin-bottom:4px}
/* Hoja inferior (modal) */
.ov{position:fixed;inset:0;background:rgba(35,23,25,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .2s}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:80;font-weight:600;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.estbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.estbtns .btn{min-height:56px;font-weight:700}
.estbtns .P{background:var(--ok-bg);border-color:var(--ok-bg);color:var(--ok)}
.estbtns .T{background:var(--late-bg);border-color:var(--late-bg);color:var(--late)}
.estbtns .F{background:var(--abs-bg);border-color:var(--abs-bg);color:var(--abs)}
.estbtns .L{background:var(--lic-bg);border-color:var(--lic-bg);color:var(--lic)}
.estbtns .on{outline:3px solid currentColor;outline-offset:-3px}
/* Escáner */
.scanbox{position:relative;border-radius:18px;overflow:hidden;background:#140c0d;aspect-ratio:3/4;max-height:62vh;width:100%}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox .frame{position:absolute;inset:16% 12%;pointer-events:none}
.scanbox .frame i{position:absolute;width:42px;height:42px;border:5px solid #fff;border-radius:6px}
.scanbox .frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
.scanbox .frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.scanbox .frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
.scanbox .frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.scanbox .laser{position:absolute;left:14%;right:14%;height:3px;background:var(--red);box-shadow:0 0 12px var(--red);top:50%;animation:las 2s ease-in-out infinite alternate}
@keyframes las{from{top:20%}to{top:78%}}
.scanbox .msg{position:absolute;left:0;right:0;bottom:0;padding:14px;color:#fff;text-align:center;font-weight:600;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.scanbox .off{position:absolute;inset:0;display:grid;place-items:center;color:#fff;text-align:center;padding:24px}
.result{position:absolute;inset:0;background:rgba(255,255,255,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center}
.result .ph{width:132px;height:166px;border-radius:12px;object-fit:cover;border:4px solid var(--ok);background:var(--mist)}
.result.T .ph{border-color:var(--late)} .result.X .ph{border-color:var(--abs)}
.result .st{font:800 30px var(--display);text-transform:uppercase;letter-spacing:.5px}
.result.P .st{color:var(--ok)} .result.T .st{color:var(--late)} .result.X .st{color:var(--abs)}
.result .nm{font:700 22px/1.1 var(--display);text-transform:uppercase}
.result .bar{position:absolute;left:0;bottom:0;height:5px;background:var(--red)}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.tog{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px;cursor:pointer;background:#fff}
.tog input{width:18px;height:18px;accent-color:var(--red)}
/* Carnets */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.cgrid figure{margin:0;display:flex;flex-direction:column;gap:6px}
.cgrid canvas,.cgrid img{width:100%;height:auto;border-radius:8px;box-shadow:0 2px 10px rgba(35,23,25,.15);background:#fff}
.cgrid label{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:600}
/* Tabla mensual */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table.month{border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;min-width:100%}
table.month th,table.month td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:center;white-space:nowrap}
table.month th{background:var(--mist);font-weight:700;position:sticky;top:0}
table.month td.n,table.month th.n{text-align:left;position:sticky;left:0;background:#fff;max-width:150px;overflow:hidden;text-overflow:ellipsis;padding-left:8px;border-right:1px solid var(--line)}
table.month th.n{background:var(--mist)}
td.cP{color:var(--ok);font-weight:700} td.cT{color:var(--late);font-weight:700} td.cF{color:var(--abs);font-weight:700;background:var(--abs-bg)} td.cL{color:var(--lic);font-weight:700}
/* Calendario */
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cal .h{font-size:12px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase}
.cal .c{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--mist);font-weight:700;font-variant-numeric:tabular-nums}
.cal .c small{font-size:10.5px;font-weight:600}
.cal .c.P{background:var(--ok-bg);color:var(--ok)} .cal .c.T{background:var(--late-bg);color:var(--late)}
.cal .c.F{background:var(--abs-bg);color:var(--abs)} .cal .c.L{background:var(--lic-bg);color:var(--lic)}
.cal .c.x{background:transparent}
.legend{display:flex;gap:6px;flex-wrap:wrap}
/* Bienvenida */
.hero{background:var(--red);color:#fff;border-radius:20px;padding:24px 20px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.hero h1{font-size:44px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.hero p{margin:0;opacity:.95}
.hero .qrmark{position:absolute;right:-20px;top:-20px;width:150px;opacity:.16}
.choice{display:flex;gap:14px;align-items:center;text-align:left;padding:16px;border:1.5px solid var(--line);border-radius:16px;background:#fff;cursor:pointer;width:100%}
.choice .ci{width:52px;height:52px;border-radius:14px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;flex:none}
.choice .ci svg{width:28px;height:28px}
.choice b{font:700 20px var(--display);text-transform:uppercase;display:block}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;word-break:break-all;background:var(--mist);border-radius:10px;padding:10px}
.logoprev{width:64px;height:64px;border-radius:12px;border:1.5px dashed var(--line);display:grid;place-items:center;overflow:hidden;background:#fff;flex:none}
.logoprev img{width:100%;height:100%;object-fit:contain}
.banner{background:var(--red-soft);color:var(--red-dk);border-radius:12px;padding:12px 14px;font-weight:600}
/* Impresión */
#print{display:none}
@media print{
  body{background:#fff}
  .app,nav.tabs,.ov,.toast{display:none!important}
  #print{display:block}
  .psheet{display:grid;grid-template-columns:repeat(3,54mm);grid-auto-rows:85.6mm;gap:5mm;justify-content:center;page-break-after:always;break-after:page}
  .psheet img{width:54mm;height:85.6mm;outline:.2mm dashed #bbb}
  .prep h2{font:800 18pt var(--display);text-transform:uppercase;margin:0 0 2mm}
  .prep .meta{font-size:10pt;margin-bottom:4mm}
  .prep table{border-collapse:collapse;width:100%;font-size:8pt}
  .prep th,.prep td{border:.2mm solid #999;padding:1mm;text-align:center}
  .prep td.n{text-align:left;white-space:nowrap}
  .prep .head{display:flex;align-items:center;gap:4mm;margin-bottom:3mm}
  .prep .head img{width:16mm;height:16mm;object-fit:contain}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs" hidden></nav>
<div id="print"></div>

<script src="vendor/jsQR.js"></script>
<script src="vendor/qrcode.js"></script>
<script>
'use strict';
/* =========================================================
   AsistQR 10 F — control de asistencia con QR
   Los datos se guardan en el propio celular (localStorage).
   ========================================================= */
const APP_VERSION = '1.0.3';
// Llave pública del administrador (dueño). Solo quien tiene la clave maestra puede crear códigos.
const ADMIN_PUB = {kty:'EC',crv:'P-256',x:'cNRSCzlm58bkhWh_sVceoD0FmkWqbmHwZIT42xiNquo',y:'4s97MZUcwfYX2LCWr3vckrdMTZi32m1DMIlC5pk0gKI',ext:true};

/* ---------- Almacenamiento ---------- */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ toast('No se pudo guardar: memoria llena. Haz un respaldo y reduce fotos.'); return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function defaultCfg(){
  return {
    ue:'', nivel:'', grado:'', maestro:'', ciudad:'', gestion:String(new Date().getFullYear()),
    hora:'08:30', tol:0, logoUE:'', logoGrado:'', color:'#C8102E',
    auto:true, autoMs:2500, cam:'environment',
    msgP:'✅ *{ue}* – {grado}\nEstimado(a) padre/madre de familia: {hijo} *{estudiante}* registró su ENTRADA el {fecha} a las *{hora}*.\n_AsistQR – Prof. {maestro}_',
    msgT:'⏰ *{ue}* – {grado}\nEstimado(a) padre/madre de familia: {hijo} *{estudiante}* llegó con RETRASO el {fecha} a las *{hora}* (hora de entrada: {entrada}).\n_AsistQR – Prof. {maestro}_',
    msgF:'❌ *{ue}* – {grado}\nEstimado(a) padre/madre de familia: {hijo} *{estudiante}* NO ASISTIÓ a clases el {fecha}. Si tiene alguna justificación, por favor comuníquese con el maestro.\n_AsistQR – Prof. {maestro}_',
    msgL:'📝 *{ue}* – {grado}\nEstimado(a) padre/madre de familia: {hijo} *{estudiante}* tiene LICENCIA registrada el {fecha}.\n_AsistQR – Prof. {maestro}_'
  };
}
let cfg = Object.assign(defaultCfg(), LS.get('aqr_cfg', {}));
let students = LS.get('aqr_students', []);
let att = LS.get('aqr_att', {});          // { 'YYYY-MM-DD': { idEst: {e,h,m,wa,n} } }
let offDays = LS.get('aqr_off', []);      // días sin clases
let lic = LS.get('aqr_lic', null);        // activación del maestro
let kids = LS.get('aqr_kids', []);        // portal de padres: reportes recibidos
const saveCfg = () => LS.set('aqr_cfg', cfg);
const saveStudents = () => LS.set('aqr_students', students);
const saveAtt = () => LS.set('aqr_att', att);
const saveOff = () => LS.set('aqr_off', offDays);

/* ---------- Utilidades ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fechaLarga = s => { const d = parseD(s); return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const titleCase = s => String(s||'').toLowerCase().replace(/(^|[\s\-])(\S)/g, (m,a,b) => a + b.toUpperCase());
const uid = (n=8) => { const a = new Uint8Array(n); crypto.getRandomValues(a); return [...a].map(x => 'abcdefghijkmnpqrstuvwxyz23456789'[x % 32]).join(''); };

const normCI = s => String(s||'').toUpperCase().replace(/[^0-9A-Z]/g,'');

function phoneWA(p){ let d = String(p||'').replace(/\D/g,''); if(!d) return ''; if(d.length === 8) d = '591' + d; return d; }

const EST = {P:'Presente', T:'Tarde', F:'Falta', L:'Licencia'};
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const ub64u = s => { s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length % 4) s += '='; const b = atob(s); const u = new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i] = b.charCodeAt(i); return u; };

function sheet(html, mount){
  closeSheet();
  const ov = document.createElement('div'); ov.className = 'ov'; ov.id = 'ov';
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  ov.addEventListener('click', e => { if(e.target === ov) closeSheet(); });
  document.body.appendChild(ov);
  mount && mount(ov.querySelector('.sheet'));
  return ov.querySelector('.sheet');
}
function closeSheet(){ const o = $('#ov'); if(o) o.remove(); }
function confirmSheet(title, text, okLabel, onOk, danger){

function fileToImg(file){ return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = r.result; }; r.onerror = no; r.readAsDataURL(file); }); }
async function photoFromFile(file){ // recorte 3:4 centrado, 300x400
  const im = await fileToImg(file); const W = 300, H = 400; const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); const r = Math.max(W/im.width, H/im.height); const w = im.width*r, h = im.height*r;
  x.fillStyle = '#fff'; x.fillRect(0,0,W,H); x.drawImage(im, (W-w)/2, (H-h)/2.4, w, h); return c.toDataURL('image/jpeg', .78);
}
async function logoFromFile(file){
  const im = await fileToImg(file); const M = 360; const r = Math.min(1, M/Math.max(im.width, im.height));
  const c = document.createElement('canvas'); c.width = Math.round(im.width*r); c.height = Math.round(im.height*r);
  c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
  return file.type === 'image/png' || file.type === 'image/webp' || file.type === 'image/svg+xml' ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', .9);
}

/* ---------- Activación y códigos ---------- */
async function verifyCode(code){
  code = String(code||'').trim(); const m = code.match(/#c=([^&\s]+)/); if(m) code = m[1];
  code = code.replace(/\s+/g,'');
  const [p, s] = code.split('.'); if(!p || !s) throw new Error('El código no tiene el formato correcto.');
  let okSig = false;
  try{ const key = await crypto.subtle.importKey('jwk', ADMIN_PUB, {name:'ECDSA', namedCurve:'P-256'}, false, ['verify']);
    okSig = await crypto.subtle.verify({name:'ECDSA', hash:'SHA-256'}, key, ub64u(s), ub64u(p)); }catch(e){ okSig = false; }
  if(!okSig) throw new Error('Código inválido. Pide un código nuevo al administrador.');
  const [id, name, exp] = dec.decode(ub64u(p)).split('|');
  if(exp && exp !== '0' && exp < today().replace(/-/g,'')) throw new Error('Este código ya venció. Pide uno nuevo al administrador.');
  return {role:'teacher', id, name, exp, code};
}
async function importAdminKey(d){
  return crypto.subtle.importKey('jwk', {...ADMIN_PUB, d}, {name:'ECDSA', namedCurve:'P-256'}, false, ['sign']);
}
async function verifyMaster(txt){
  const d = String(txt||'').trim().replace(/^AQR-ADMIN-/,'').replace(/\s+/g,'');
  let ok = false;
  try{ const k = await importAdminKey(d);
    const sig = await crypto.subtle.sign({name:'ECDSA', hash:'SHA-256'}, k, enc.encode('prueba'));
    const pub = await crypto.subtle.importKey('jwk', ADMIN_PUB, {name:'ECDSA', namedCurve:'P-256'}, false, ['verify']);
    ok = await crypto.subtle.verify({name:'ECDSA', hash:'SHA-256'}, pub, sig, enc.encode('prueba')); }catch(e){ ok = false; }
  if(!ok) throw new Error('Clave maestra incorrecta.');
  return {role:'owner', id:'owner', name:'Administrador', key:d};
}
async function makeCode(name, exp){
  const k = await importAdminKey(lic.key); const id = uid(6);
  const payload = `${id}|${String(name).replace(/\|/g,' ').trim()}|${exp ? exp.replace(/-/g,'') : '0'}`;
  const sig = await crypto.subtle.sign({name:'ECDSA', hash:'SHA-256'}, k, enc.encode(payload));
  return {id, code: b64u(enc.encode(payload)) + '.' + b64u(sig)};
}
async function checkLicense(){
  if(!lic) return false;
  try{
    if(lic.role === 'owner') await verifyMaster(lic.key); else { const v = await verifyCode(lic.code); lic.exp = v.exp; }
  }catch(e){ lockout(e.message); return false; }
  try{ const r = await fetch('revocados.json', {cache:'no-store'}); if(r.ok){ const j = await r.json(); if((j.ids||[]).includes(lic.id)){ lockout('Este código fue desactivado por el administrador.'); return false; } } }catch(e){}
  return true;
}
function lockout(msg){ LS.del('aqr_lic'); lic = null; route = 'welcome'; render(); setTimeout(() => toast(msg), 300); }

/* ---------- Portal de padres: enlace cifrado con el C.I. ---------- */
async function ciKey(ci, salt){
  const base = await crypto.subtle.importKey('raw', enc.encode(normCI(ci)), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:60000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
function reportData(s){
  const y = String(cfg.gestion || new Date().getFullYear()); const parts = [];
  Object.keys(att).filter(d => d.startsWith(y) && !isOff(d)).sort().forEach(d => { const r = att[d][s.id]; if(r) parts.push(d.slice(5).replace('-','') + r.e + (r.h || '').replace(':','')); });
  return {v:1, n:titleCase(s.nombre), g:cfg.grado, u:cfg.ue, c:cfg.ciudad, m:titleCase(cfg.maestro), y, h:cfg.hora, r:parts.join(','), t:Date.now()};
}
async function portalLink(s){
  if(!normCI(s.ci)) throw new Error('Primero registra el C.I. de ' + titleCase(s.nombre) + ' (Estudiantes).');
  const salt = crypto.getRandomValues(new Uint8Array(12)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, await ciKey(s.ci, salt), enc.encode(JSON.stringify(reportData(s))));
  const all = new Uint8Array(1 + 12 + 12 + ct.byteLength); all[0] = 1; all.set(salt, 1); all.set(iv, 13); all.set(new Uint8Array(ct), 25);
  return baseURL() + '#p=' + b64u(all);
}
async function openPortalPayload(b, ci){
  const u = ub64u(b); const salt = u.slice(1,13), iv = u.slice(13,25), ct = u.slice(25);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, await ciKey(ci, salt), ct);
  return JSON.parse(dec.decode(pt));
}
function parseRecs(k){ const out = {}; (k.r ? k.r.split(',') : []).forEach(x => { const md = x.slice(0,4), e = x[4], h = x.slice(5); out[`${k.y}-${md.slice(0,2)}-${md.slice(2)}`] = {e, h: h ? h.slice(0,2) + ':' + h.slice(2) : ''}; }); return out; }

/* ---------- Estadísticas ---------- */
function monthDays(ym){ // días hábiles (lun-vie) del mes hasta hoy
  const [y, m] = ym.split('-').map(Number); const out = []; const last = new Date(y, m, 0).getDate(); const t = today();
  for(let d=1; d<=last; d++){ const dt = new Date(y, m-1, d); const s = ymd(dt); if(s > t) break; if(dt.getDay() > 0 && dt.getDay() < 6) out.push(s); }
  return out;
}
function classDays(ym){ return monthDays(ym).filter(d => !isOff(d) && att[d] && Object.keys(att[d]).length); }
function statsFor(sid, days){ const c = {P:0,T:0,F:0,L:0}; days.forEach(d => { const r = (att[d]||{})[sid]; if(r) c[r.e]++; }); const tot = c.P + c.T + c.F + c.L; c.pct = tot ? Math.round((c.P + c.T) / tot * 100) : 0; c.tot = tot; return c; }

/* ---------- Carnet (canvas 54 x 85.6 mm) ---------- */
const CW = 640, CH = 1015;
function wrapText(x, text, maxW){ const words = String(text).split(/\s+/); const lines = []; let cur = ''; words.forEach(w => { const t = cur ? cur + ' ' + w : w; if(x.measureText(t).width > maxW && cur){ lines.push(cur); cur = w; } else cur = t; }); if(cur) lines.push(cur); return lines; }
function fitFont(x, text, maxW, size, weight, fam, min=14){ let s = size; do{ x.font = `${weight} ${s}px ${fam}`; if(x.measureText(text).width <= maxW) break; s -= 1; } while(s > min); return s; }
function roundRect(x, X, Y, W, H, R){ x.beginPath(); x.moveTo(X+R, Y); x.arcTo(X+W, Y, X+W, Y+H, R); x.arcTo(X+W, Y+H, X, Y+H, R); x.arcTo(X, Y+H, X, Y, R); x.arcTo(X, Y, X+W, Y, R); x.closePath(); }
async function drawCarnet(canvas, s){
  canvas.width = CW; canvas.height = CH; const x = canvas.getContext('2d'); const col = cfg.color || '#C8102E';
  const COND = '"Barlow Condensed","Arial Narrow",Arial,sans-serif', BODY = '"Barlow",Arial,sans-serif';
  try{ await document.fonts.ready; }catch(e){}
  const [lu, lg, ph] = await Promise.all([loadImg(cfg.logoUE), loadImg(gradeLogo()), loadImg(s.foto)]);
  x.fillStyle = '#fff'; x.fillRect(0, 0, CW, CH);
  // franja superior
  x.fillStyle = col; x.fillRect(0, 0, CW, 14);
  // logos
  const L = 128; if(lu){ const r = Math.min(L/lu.width, L/lu.height); x.drawImage(lu, 22 + (L - lu.width*r)/2, 30 + (L - lu.height*r)/2, lu.width*r, lu.height*r); }
  if(lg){ const r = Math.min(L/lg.width, L/lg.height); x.drawImage(lg, CW - 22 - L + (L - lg.width*r)/2, 30 + (L - lg.height*r)/2, lg.width*r, lg.height*r); }
  // nombre de la U.E.
  x.textAlign = 'center'; x.fillStyle = col; x.font = `800 34px ${COND}`;
  const ueLines = wrapText(x, (cfg.ue || 'Unidad Educativa').toUpperCase(), CW - 2*L - 70).slice(0,3);
  const ueY = 94 - (ueLines.length - 1) * 17; ueLines.forEach((l, i) => x.fillText(l, CW/2, ueY + i*34));
  x.fillStyle = '#5c4b4e'; x.font = `600 19px ${BODY}`;
  if(cfg.nivel) x.fillText(wrapText(x, cfg.nivel, CW - 2*L - 60)[0], CW/2, ueY + ueLines.length*34 + 4);
  // banda
  x.fillStyle = col; x.fillRect(0, 186, CW, 58);
  x.fillStyle = '#fff'; x.font = `800 32px ${COND}`; x.fillText(`CARNET ESTUDIANTIL  ·  ${cfg.gestion}`, CW/2, 226);
  // foto
  const PW = 220, PH = 276, PX = (CW - PW)/2, PY = 268;
  x.fillStyle = col; roundRect(x, PX-7, PY-7, PW+14, PH+14, 18); x.fill();
  x.save(); roundRect(x, PX, PY, PW, PH, 12); x.clip(); x.fillStyle = '#f1e9ea'; x.fillRect(PX, PY, PW, PH);
  if(ph){ const r = Math.max(PW/ph.width, PH/ph.height); x.drawImage(ph, PX + (PW - ph.width*r)/2, PY + (PH - ph.height*r)/2, ph.width*r, ph.height*r); }
  else { x.fillStyle = '#cdbcbf'; x.beginPath(); x.arc(CW/2, PY + 105, 52, 0, 7); x.fill(); x.beginPath(); x.ellipse(CW/2, PY + PH + 10, 100, 110, 0, Math.PI, 0); x.fill(); }
  x.restore();
  // nombre del estudiante
  x.fillStyle = '#231719'; x.font = `800 36px ${COND}`; const nl = wrapText(x, String(s.nombre||'').toUpperCase(), CW - 60).slice(0,2);
  nl.forEach((l, i) => { fitFont(x, l, CW - 50, 36, 800, COND); x.fillText(l, CW/2, 592 + i*38); });
  // datos + QR
  const top = 592 + nl.length*38 + 6, QS = 236, QX = CW - 26 - QS, QY = Math.min(top + 4, CH - 58 - QS - 8);
  x.textAlign = 'left'; const rows = [['CURSO', cfg.grado], ['C.I.', s.ci || '—'], ['RUDE', s.rude || '—'], ['GESTIÓN', cfg.gestion]];
  let ry = QY + 30; rows.forEach(([k, v]) => { x.fillStyle = col; x.font = `700 17px ${BODY}`; x.fillText(k, 30, ry); x.fillStyle = '#231719'; fitFont(x, String(v), QX - 44, 28, 700, COND); x.fillText(String(v), 30, ry + 28); ry += 58; });
  drawQR(x, 'AQR1|' + s.id, QX, QY, QS);
  // pie
  x.fillStyle = col; x.fillRect(0, CH - 52, CW, 52); x.fillStyle = '#fff'; x.textAlign = 'center';
  const pie = [cfg.ciudad, cfg.maestro ? 'Prof. ' + titleCase(cfg.maestro) : ''].filter(Boolean).join('  ·  ');
  fitFont(x, pie, CW - 40, 21, 600, BODY); x.fillText(pie, CW/2, CH - 19);
  return canvas;
}
function drawQR(x, text, X, Y, S){
  const q = qrcode(0, 'M'); q.addData(text); q.make(); const n = q.getModuleCount(); const quiet = 2; const cell = S / (n + quiet*2);
  x.fillStyle = '#fff'; x.fillRect(X, Y, S, S); x.fillStyle = '#000';
  for(let r=0; r<n; r++) for(let c=0; c<n; c++) if(q.isDark(r, c)) x.fillRect(X + (c+quiet)*cell, Y + (r+quiet)*cell, Math.ceil(cell), Math.ceil(cell));
}

function avatar(s){ return `<div class="av">${s.foto ? `<img src="${s.foto}" alt="">` : esc(initials(s.nombre))}</div>`; }

async function startScanner(){
  const off = $('#soff'); if(!off) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ $('#smsg').textContent = 'Este navegador no permite usar la cámara. Abre la app con https en Chrome o Safari.'; return; }
  try{
    stopScanner();
    try{ stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:cfg.cam}, width:{ideal:1280}, height:{ideal:720}}, audio:false}); }
    catch(e1){ if(e1 && (e1.name === 'NotAllowedError' || e1.name === 'SecurityError')) throw e1; stream = await navigator.mediaDevices.getUserMedia({video:true, audio:false}); }
    const v = $('#vid'); if(!v){ stopScanner(); return; }
    v.srcObject = stream; await v.play(); off.hidden = true; paused = false;
    try{ if('BarcodeDetector' in window){ const f = await BarcodeDetector.getSupportedFormats(); detector = f.includes('qr_code') ? new BarcodeDetector({formats:['qr_code']}) : null; } }catch(e){ detector = null; }
    scanLoop();
  }catch(e){ off.hidden = false; const n = e && e.name;
    $('#smsg').textContent = n === 'NotAllowedError' || n === 'SecurityError' ? 'La cámara está bloqueada para AsistQR. Toca “Cómo dar permiso”.'
      : n === 'NotReadableError' || n === 'AbortError' ? 'Otra app está usando la cámara. Ciérrala (WhatsApp, cámara, videollamada) y vuelve a intentar.'
      : n === 'NotFoundError' || n === 'OverconstrainedError' ? 'No se encontró una cámara. Prueba con “Cámara frontal/trasera”.'
      : 'No se pudo abrir la cámara (' + (n || 'error') + ').';
    if(!$('#camHelp')){ const b = document.createElement('button'); b.className = 'btn sm'; b.id = 'camHelp'; b.textContent = 'Cómo dar permiso'; b.onclick = camHelp; $('#soff .stack').appendChild(b); } }
}
function camHelp(){
  sheet(`<h3>Dar permiso de cámara</h3>
  <p style="margin:0"><b>Opción 1 (app instalada):</b> mantén presionado el ícono rojo de <b>AsistQR</b> → <b>Información de la app</b> (ⓘ) → <b>Permisos</b> → <b>Cámara</b> → <b>Permitir</b>.</p>
  <p style="margin:0"><b>Opción 2 (desde Chrome):</b> abre Chrome → menú <b>⋮</b> → <b>Configuración</b> → <b>Configuración de sitios</b> → <b>Cámara</b>. Activa la cámara, y si <b>alvaroangolahuanca-stack.github.io</b> aparece en <b>Bloqueados</b>, tócalo y elige <b>Permitir</b>.</p>
  <p style="margin:0">Revisa también que Chrome tenga permiso: <b>Ajustes del celular → Apps → Chrome → Permisos → Cámara → Permitir</b>.</p>
  <p class="hint" style="margin:0">Luego cierra AsistQR por completo y vuelve a abrirla.</p>
  <button class="btn pri block" onclick="closeSheet();startScanner()">Intentar de nuevo</button>`);
}
function stopScanner(){ clearTimeout(scanTimer); clearTimeout(autoT); scanTimer = null; if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } }
const scanCanvas = document.createElement('canvas'); const scanCtx = scanCanvas.getContext('2d', {willReadFrequently:true});
async function scanLoop(){
  if(!stream) return; const v = $('#vid');
  if(v && !paused && v.readyState >= 2 && v.videoWidth){
    let code = null;
    try{
      if(detector){ const r = await detector.detect(v); if(r.length) code = r[0].rawValue; }
      else{ const w = 640, h = Math.round(v.videoHeight * 640 / v.videoWidth); scanCanvas.width = w; scanCanvas.height = h; scanCtx.drawImage(v, 0, 0, w, h); const r = jsQR(scanCtx.getImageData(0, 0, w, h).data, w, h, {inversionAttempts:'dontInvert'}); if(r) code = r.data; }
    }catch(e){ detector = null; }
    if(code && !(code === lastCode && Date.now() - lastAt < 4000)){ lastCode = code; lastAt = Date.now(); onCode(code); }
  }
  scanTimer = setTimeout(scanLoop, detector ? 150 : 110);
}
function beep(ok){ try{ audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = ok ? 1046 : 220; o.type = ok ? 'sine' : 'square'; g.gain.value = .12; o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + (ok ? .14 : .3)); }catch(e){} try{ navigator.vibrate && navigator.vibrate(ok ? 80 : [60,60,60]); }catch(e){} }
function findByCode(code){
  const m = String(code).match(/^AQR1\|([a-z0-9]+)/i); if(m) return students.find(s => s.id === m[1]);
  const n = normCI(code); return n ? students.find(s => normCI(s.ci) === n || normCI(s.rude) === n) : null;
}
function onCode(code){
  const s = findByCode(code);
  if(!s){ beep(false); showResult({cls:'X', title:'Carnet no reconocido', sub:'Este código no pertenece a tu lista de estudiantes.'}); return; }
  registerArrival(s, 'qr');
}
function registerArrival(s, metodo){
  const d = today(); const prev = recOf(s.id, d);
  if(prev && (prev.e === 'P' || prev.e === 'T')){ beep(false); showResult({cls:prev.e, s, title:'Ya registrado', sub:`${EST[prev.e]} a las ${prev.h}`}); return; }
  const h = nowHM(); const e = estadoPorHora(h); dayRec(d)[s.id] = {e, h, m:metodo, wa:false, n:''}; saveAtt();
  beep(true); showResult({cls:e, s, title:e === 'P' ? 'Entrada registrada' : 'Llegó tarde', sub:`${cfg.grado} · ${h}`, wa:true});
  renderLast();
}
function showResult({cls, s, title, sub, wa}){
  const box = $('#sres'); if(!box){ toast(title + (s ? ': ' + titleCase(s.nombre) : '')); return; }
  paused = true; clearTimeout(autoT);
  box.innerHTML = `<div class="result ${cls}">${s ? (s.foto ? `<img class="ph" src="${s.foto}" alt="">` : `<div class="ph" style="display:grid;place-items:center;font:800 44px var(--display);color:var(--red-dk)">${esc(initials(s.nombre))}</div>`) : `<div class="ph" style="display:grid;place-items:center">${I.lock}</div>`}
    <div class="st">${esc(title)}</div>${s ? `<div class="nm">${esc(titleCase(s.nombre))}</div>` : ''}<div class="sub">${esc(sub || '')}</div>
    <div class="row" style="justify-content:center">${wa && s ? `<button class="btn wa" id="rWA">${I.wa} Avisar</button>` : ''}<button class="btn dark" id="rNext">Siguiente</button></div>${cfg.auto ? '<div class="bar" id="rBar"></div>' : ''}</div>`;
  const next = () => { clearTimeout(autoT); box.innerHTML = ''; paused = false; };
  $('#rNext').onclick = next;
  const w = $('#rWA'); if(w) w.onclick = () => { clearTimeout(autoT); next(); sendWA(s.id, today(), renderLast); };
  if(cfg.auto){ const ms = Number(cfg.autoMs) || 2500; const bar = $('#rBar'); bar.style.width = '100%'; bar.style.transition = `width ${ms}ms linear`; requestAnimationFrame(() => requestAnimationFrame(() => bar.style.width = '0%')); autoT = setTimeout(next, ms); }
}

function bindCar(){
  if(!students.length) return;
  (async () => { for(const c of $$('canvas[data-c]')){ const s = students.find(x => x.id === c.dataset.c); if(route !== 'car') return; await drawCarnet(c, s); } })();
  $$('[data-sel]').forEach(b => b.onchange = () => { b.checked ? carSel.add(b.dataset.sel) : carSel.delete(b.dataset.sel); $('#cN').textContent = carSel.size; });
  $('#cAll').onclick = () => { carSel = carSel.size === students.length ? new Set() : new Set(students.map(s => s.id)); render(); };
  $$('[data-png]').forEach(b => b.onclick = async () => { const s = students.find(x => x.id === b.dataset.png); const c = await drawCarnet(document.createElement('canvas'), s); c.toBlob(bl => shareOrDownload(bl, `Carnet_${s.nombre.replace(/\s+/g,'_')}.png`), 'image/png'); });
  $('#cPrint').onclick = printCarnets;
}
async function shareOrDownload(blob, name){
  const file = new File([blob], name, {type:blob.type});
  if(navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file], title:name}); return; }catch(e){ if(e.name === 'AbortError') return; } }
  downloadBlob(blob, name);
}
async function printCarnets(){
  const sel = students.filter(s => carSel.has(s.id)); if(!sel.length){ toast('Selecciona al menos un carnet'); return; }
  toast('Preparando carnets…'); const urls = [];
  for(const s of sel){ const c = await drawCarnet(document.createElement('canvas'), s); urls.push(c.toDataURL('image/jpeg', .93)); }
  let html = ''; for(let i=0; i<urls.length; i+=9) html += `<div class="psheet">${urls.slice(i, i+9).map(u => `<img src="${u}" alt="">`).join('')}</div>`;
  doPrint(html, '@page{size:letter portrait;margin:8mm}');
}
function doPrint(html, pageCss){
  const p = $('#print'); p.innerHTML = `<style>${pageCss}</style>` + html;
  const imgs = $$('img', p); Promise.all(imgs.map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; }))).then(() => setTimeout(() => window.print(), 150));
}

function calHTML(ym, getRec){
  const [y, m] = ym.split('-').map(Number); const first = new Date(y, m-1, 1); const last = new Date(y, m, 0).getDate();
  let cells = ['Lun','Mar','Mié','Jue','Vie'].map(d => `<div class="h">${d}</div>`).join('');
  let lead = (first.getDay() + 6) % 7; if(lead > 4) lead = 0; else for(let i=0; i<lead; i++) cells += '<div class="c x"></div>';

async function exportXLS(){

  const days = classDays(repMonth); const [y, m] = repMonth.split('-').map(Number);

  const aoa = [[cfg.ue], [`${cfg.nivel ? cfg.nivel + ' · ' : ''}${cfg.grado} · Gestión ${cfg.gestion}`], [`Maestro(a): ${titleCase(cfg.maestro)}`], [`Registro de asistencia – ${cap(MESES[m-1])} ${y}`], [], ...head, ...rows, [], ['P = Presente, T = Tarde, F = Falta, L = Licencia']];
  const ws = XLSX.utils.aoa_to_sheet(aoa);

  const pctCol = 3 + days.length + 4; rows.forEach((r, i) => { const ref = XLSX.utils.encode_cell({r:6 + i, c:pctCol}); if(ws[ref] && typeof ws[ref].v === 'number') ws[ref].z = '0%'; });
  const det = [['Fecha','Estudiante','C.I.','Estado','Hora','Registro','Nota']];

  const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  shareOrDownload(new Blob([out], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), `Asistencia_${cfg.grado.replace(/[^\w]+/g,'')}_${repMonth}.xlsx`);

      ${kids.length > 1 ? `<button class="btn" onclick="portalKid=null;render()">Ver otros hijos</button>` : ''}`;
  } else if(kids.length){
    body = `<div class="list">${kids.map((k, i) => `<div class="item" data-k="${i}"><div class="av">${esc(initials(k.n))}</div><div class="nm"><b>${esc(k.n)}</b><small>${esc(k.u)} · ${esc(k.g)}</small></div>${I.right.replace('<svg','<svg width="18" height="18"')}</div>`).join('')}</div>`;
  } else {
    body = `<div class="card soft empty"><b>Aún no tienes reportes</b>Cuando el maestro te envíe el enlace por WhatsApp, ábrelo y escribe el C.I. de tu hijo(a). Quedará guardado aquí.</div>`;
  }
  return `<main style="padding-top:calc(16px + env(safe-area-inset-top,0px))"><div class="row">${back}<h2>Portal de padres</h2></div>${body}${installUI()}
  ${!lic ? `<button class="btn ghost sm" style="align-self:center" onclick="go('activar')">Soy maestro(a)</button>` : ''}</main>`;
}
function bindPortal(){
  const g = $('#pGo'); if(g) g.onclick = async () => {
    const ci = $('#pCI').value; $('#pErr').textContent = ''; if(!normCI(ci)){ $('#pErr').textContent = 'Escribe el C.I.'; return; }
    try{ const k = await openPortalPayload(portalPending, ci); const key = k.n + '|' + k.u + '|' + k.g;
      const i = kids.findIndex(x => (x.n + '|' + x.u + '|' + x.g) === key);
      if(i >= 0){ if(k.t >= (kids[i].t || 0)) kids[i] = k; portalKid = i; } else { kids.push(k); portalKid = kids.length - 1; }
      LS.set('aqr_kids', kids); portalPending = null; portalMonth = latestMonth(k); route = 'portal'; render();
    }catch(e){ $('#pErr').textContent = 'El C.I. no coincide con este reporte. Revisa el número.'; }
  };
  const ci = $('#pCI'); if(ci) ci.onkeydown = e => { if(e.key === 'Enter') g.click(); };
  $$('[data-k]').forEach(el => el.onclick = () => { portalKid = Number(el.dataset.k); portalMonth = latestMonth(kids[portalKid]); render(); });
  const mv = n => { const [y, m] = portalMonth.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); portalMonth = `${d.getFullYear()}-${pad(d.getMonth()+1)}`; render(); };
  const p = $('#pmP'); if(p) p.onclick = () => mv(-1); const n = $('#pmN'); if(n) n.onclick = () => mv(1);
  if(portalKid === null && kids.length === 1 && !portalPending){ portalKid = 0; portalMonth = latestMonth(kids[0]); render(); }
}
function latestMonth(k){ const ds = Object.keys(parseRecs(k)).sort(); const cur = today().slice(0,7); return ds.length && ds[ds.length-1].slice(0,7) < cur && ds[ds.length-1].startsWith(k.y) ? ds[ds.length-1].slice(0,7) : (String(k.y) === cur.slice(0,4) ? cur : ds.length ? ds[ds.length-1].slice(0,7) : cur); }

/* ---------- Carga de datos por enlace (#d=) ---------- */
async function importLink(b){
  let d; try{ d = JSON.parse(dec.decode(ub64u(b))); if(d.app !== 'AsistQR') throw 0; }catch(e){ toast('El enlace de datos no es válido'); return; }
  const apply = async () => {
    const c = Object.assign({}, d.cfg || {});
    if(c.logoUE && !c.logoUE.startsWith('data:')){ try{ const bl = await (await fetch(c.logoUE)).blob(); c.logoUE = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(bl); }); }catch(e){ c.logoUE = ''; } }
    cfg = Object.assign(cfg, c); saveCfg();
    const nuevos = (d.students || []).filter(s => !students.some(x => x.nombre === s.nombre));
    students = students.concat(nuevos.map(s => Object.assign({id:uid(8), ci:'', rude:'', genero:'', nac:'', tutor:'', tel:'', foto:''}, s)));
    students.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es')); saveStudents(); carSel = null;
    route = 'hoy'; render(); toast(`Listo: ${nuevos.length} estudiantes cargados`);
  };
  sheet(`<h3>Cargar datos</h3><p style="margin:0">Se cargarán <b>${esc(d.cfg && d.cfg.ue || '')}</b> – <b>${esc(d.cfg && d.cfg.grado || '')}</b>, el logo y <b>${(d.students||[]).length} estudiantes</b>.</p><button class="btn pri big block" id="ilGo">Cargar ahora</button><button class="btn block" onclick="closeSheet()">Cancelar</button>`, s => {
    $('#ilGo', s).onclick = async () => { closeSheet(); await apply(); };
  });
}

/* ---------- Arranque ---------- */
(async function boot(){
  if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  const h = location.hash;
  if(h.startsWith('#p=')){ portalPending = h.slice(3); route = 'portal'; history.replaceState(null, '', location.pathname); }
  if(h.startsWith('#c=')){ const code = h.slice(3); history.replaceState(null, '', location.pathname);
    if(!lic){ try{ await activate(code); }catch(e){ route = 'activar'; render(); $('#acCode').value = code; $('#acErr').textContent = e.message || 'Código inválido.'; return; } }
  }
  if(h.startsWith('#d=')){ history.replaceState(null, '', location.pathname);
    if(lic){ render(); await importLink(h.slice(3)); return; }
    route = 'activar'; render(); setTimeout(() => toast('Primero entra con tu código y vuelve a abrir el enlace'), 300); return;
  }
  if(!lic && route === 'hoy') route = 'welcome';
  render();
  if(lic) checkLicense();
  // Al volver del WhatsApp, refrescar la vista
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden' && route === 'scan') stopScanner(); else if(document.visibilityState === 'visible' && route === 'scan') startScanner(); });
})();
</script>
